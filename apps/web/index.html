<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <meta name="theme-color" content="#f5f8ff"/>
  <title>ZONOE 下载站</title>
</head>
<body>
  <div id="root">
    <div id="boot-fallback" style="min-height:100vh;display:grid;place-items:center;padding:24px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#475467;background:#f5f8ff;text-align:center">
      <div><strong style="display:block;color:#2f6fed;font-size:20px;margin-bottom:8px">ZONOE</strong><span>正在启动下载站…</span></div>
    </div>
  </div>
  <script>
    (function(){
      function showBootError(message){
        var el=document.getElementById('boot-fallback');
        if(!el)return;
        el.innerHTML='<div><strong style="display:block;color:#b42318;font-size:18px;margin-bottom:8px">前端启动失败</strong><span>'+message+'</span><div style="margin-top:10px;font-size:12px;color:#667085">请检查 /assets/ 静态资源、浏览器控制台和反向代理配置。</div></div>';
      }
      window.addEventListener('error',function(event){
        if(event && event.target && (event.target.tagName==='SCRIPT'||event.target.tagName==='LINK')) showBootError('静态资源加载失败');
      },true);
      window.setTimeout(function(){
        if(document.getElementById('boot-fallback')) showBootError('页面脚本未完成启动');
      },8000);
    })();
  </script>
  <script type="module" src="/src/main.jsx"></script>
  <noscript>请启用 JavaScript 后访问 ZONOE 下载站。</noscript>
</body>
</html>
