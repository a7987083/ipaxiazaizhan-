name: Bootstrap production source

on:
  push:
    branches:
      - work/zonoe-download-v1

permissions:
  contents: write

jobs:
  bootstrap-build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: zonoe_test
          POSTGRES_USER: zonoe
          POSTGRES_PASSWORD: zonoe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zonoe -d zonoe_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://zonoe:zonoe@127.0.0.1:5432/zonoe_test?schema=public
      JWT_SECRET: test-jwt-secret-at-least-thirty-two-characters
      SOURCE_CONFIG_KEY: test-source-config-encryption-key
      IP_HASH_SALT: test-ip-hash-salt-value
      PUBLIC_BASE_URL: http://localhost
      FRONTEND_ORIGIN: http://localhost:5173
      LOCAL_STORAGE_DIR: /tmp/zonoe-test-uploads
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Expand source package
        run: |
          tar -xzf .bootstrap/zonoe-src.tar.gz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-source.yml
      - name: Install dependencies
        run: npm install
      - name: Generate Prisma client
        run: npm run db:generate -w backend
      - name: Apply test migrations
        run: npm run db:migrate -w backend
      - name: Integration tests
        run: npm test
      - name: Production builds
        run: npm run build
      - name: Validate Compose
        run: |
          cp .env.example .env
          docker compose config -q
      - name: Build Docker images
        run: |
          docker build -t zonoe-backend-ci ./backend
          docker build -t zonoe-frontend-ci ./frontend
      - name: Commit validated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "feat: implement production IPA download platform"
          git push origin HEAD:work/zonoe-download-v1
