name: Bootstrap ZONOE IPA Download Source

on:
  push:
    branches:
      - work/zonoe-download-v1

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: zonoe_test
          POSTGRES_USER: zonoe
          POSTGRES_PASSWORD: zonoe_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zonoe -d zonoe_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://zonoe:zonoe_test_password@127.0.0.1:5432/zonoe_test
      JWT_SECRET: test-jwt-secret-at-least-thirty-two-characters
      IP_HASH_SALT: test-ip-hash-salt-value
      SOURCE_CONFIG_KEY: test-source-config-encryption-key
      PUBLIC_BASE_URL: http://localhost
      FRONTEND_ORIGIN: http://localhost:5173
      LOCAL_STORAGE_DIR: /tmp/zonoe-test-uploads
      COOKIE_SECURE: 'false'
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: TestPassword123!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reassemble source package
        shell: bash
        run: |
          cat .bootstrap/src.b64.* | base64 --decode > /tmp/zonoe-source.tar.gz
          test "$(wc -c < /tmp/zonoe-source.tar.gz)" -gt 30000
          tar -tzf /tmp/zonoe-source.tar.gz >/dev/null
      - name: Expand source package
        shell: bash
        run: |
          tar -xzf /tmp/zonoe-source.tar.gz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-v2.yml
      - name: Apply PostgreSQL parameter fix
        run: sed -i "s/CASE WHEN \\$9='published'/CASE WHEN \\$9::text='published'/" apps/api/src/repositories/appRepository.js
      - name: Install dependencies
        run: npm install
      - name: Database migrations
        run: npm run migrate -w apps/api
      - name: Integration tests
        run: npm test
      - name: Production build checks
        run: npm run build
      - name: Compose validation
        run: |
          cp .env.example .env
          sed -i 's/CHANGE_ME_DB_PASSWORD/ci-db-password/g; s/CHANGE_ME_TO_AT_LEAST_32_RANDOM_CHARACTERS/ci-jwt-secret-at-least-32-characters/g; s/CHANGE_ME_TO_RANDOM_SALT/ci-ip-hash-salt/g; s/CHANGE_ME_TO_32_BYTE_SECRET_MATERIAL/ci-source-config-key-32-bytes/g; s/CHANGE_ME_ADMIN_PASSWORD/TestPassword123!/g' .env
          docker compose config >/dev/null
      - name: Docker image build
        run: docker compose build api web
      - name: Build local deployment package
        run: ./scripts/build-release.sh /tmp/zonoe-release
      - name: Commit validated source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: implement ZONOE IPA download platform v2026091201"
          git push origin HEAD:work/zonoe-download-v1
