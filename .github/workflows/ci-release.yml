name: ZONOE IPA Download CI Release

on:
  push:
    branches:
      - work/zonoe-download-v1
      - feature/baota-oneclick-deploy-v1
      - feature/baota-native-deploy-v1
    paths:
      - 'VERSION'
      - 'apps/**'
      - 'public/**'
      - 'deploy/**'
      - 'scripts/**'
      - 'auto_install.json'
      - 'nginx.rewrite'
      - 'install.sh'
      - 'insatll.sh'
      - 'update.sh'
      - 'install-local.sh'
      - 'install-online.sh'
      - 'docker-compose*.yml'
      - 'package.json'
      - 'package-lock.json'
      - '.env.example'
      - '.env.docker.example'
      - 'DEPLOY.md'
      - '.github/workflows/ci-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zonoe-ipa-download-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: zonoe_test
          POSTGRES_USER: zonoe
          POSTGRES_PASSWORD: zonoe_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zonoe -d zonoe_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      HOST: 127.0.0.1
      PORT: 3001
      DATABASE_URL: postgresql://zonoe:zonoe_test_password@127.0.0.1:5432/zonoe_test
      JWT_SECRET: test-jwt-secret-at-least-thirty-two-characters
      IP_HASH_SALT: test-ip-hash-salt-value
      SOURCE_CONFIG_KEY: test-source-config-encryption-key
      PUBLIC_BASE_URL: http://127.0.0.1:18082
      FRONTEND_ORIGIN: http://127.0.0.1:18082
      LOCAL_STORAGE_DIR: /tmp/zonoe-test-uploads
      COOKIE_SECURE: 'false'
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: TestPassword123!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Database migrations
        run: npm run migrate -w apps/api
      - name: Integration tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Native API smoke
        shell: bash
        run: |
          set -euo pipefail
          node apps/api/src/server.js >/tmp/zonoe-api.log 2>&1 &
          API_PID=$!
          trap 'kill "$API_PID" >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3001/healthz >/tmp/health.json 2>/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3001/api/v1/home >/dev/null
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/health.json'))
          expected=open('VERSION').read().strip()
          assert j.get('ok') is True
          assert j.get('version') == expected, (j, expected)
          PY
      - name: Native frontend static smoke
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 18082 --bind 127.0.0.1 --directory apps/web/dist >/tmp/zonoe-web.log 2>&1 &
          WEB_PID=$!
          trap 'kill "$WEB_PID" >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18082/ >/tmp/zonoe-web-index.html 2>/dev/null; then break; fi
            sleep 1
          done
          grep -q 'ZONOE' /tmp/zonoe-web-index.html
          ASSET="$(grep -oE '/assets/[^"[:space:]]+\.js' /tmp/zonoe-web-index.html | head -n1)"
          test -n "$ASSET"
          curl -fsS "http://127.0.0.1:18082${ASSET}" >/dev/null
          grep -Fq "window.location.assign('/admin')" apps/web/src/pages/Login.jsx
          grep -Fq "window.location.assign('/login')" apps/web/src/pages/Admin.jsx
      - name: Shell validation
        run: |
          bash -n install.sh
          bash -n insatll.sh
          bash -n update.sh
          bash -n install-local.sh
          bash -n install-online.sh
          bash -n scripts/build-release.sh
          bash -n scripts/lib-deploy.sh
          bash -n scripts/smoke.sh
          bash -n scripts/backup.sh
          bash -n scripts/enable-https.sh
          bash update.sh --help >/tmp/update-help.txt
          grep -Fq 'GitHub 在线更新' /tmp/update-help.txt
      - name: BaoTa native contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool auto_install.json >/dev/null
          test "$(python3 -c 'import json; print(json.load(open("auto_install.json"))["run_path"])')" = "/public"
          test "$(python3 -c 'import json; print(json.load(open("auto_install.json"))["db_config"])')" = ""
          grep -Fq 'proxy_pass http://127.0.0.1:3000;' nginx.rewrite
          grep -Fq 'DEPLOY_MODE native' install.sh
          grep -Fq 'zonoe-api' install.sh
          grep -Fq 'data/install.log' install.sh
          grep -Fq 'ALTER ROLE :"role" WITH LOGIN PASSWORD :'"'"'dbpass'"'"';' install.sh
          grep -Fq '# BEGIN ZONOE MANAGED AUTH' install.sh
          grep -Fq 'SHOW hba_file;' install.sh
          grep -Fq -- "--exclude='.user.ini'" install.sh
          grep -Fq -- "--exclude='.well-known/'" install.sh
          ! grep -Fq 'rm -rf "$ROOT/public"' install.sh
          ! grep -Fq 'docker compose up' install.sh
          test -f public/index.html
      - name: GitHub updater contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'releases/latest' install-online.sh
          grep -Fq -- '--branch' install-online.sh
          grep -Fq 'baota-native\.zip' install-online.sh
          grep -Fq 'sha256sum -c' install-online.sh
          grep -Fq 'update-history.log' install-online.sh
          grep -Fq -- "--exclude='public/'" scripts/lib-deploy.sh
          grep -Fq -- "--exclude='.user.ini'" scripts/lib-deploy.sh
          grep -Fq 'zipfile.is_zipfile' scripts/lib-deploy.sh
      - name: Legacy Docker compose syntax
        shell: bash
        run: |
          set -euo pipefail
          cp .env.docker.example .env
          sed -i 's/CHANGE_ME_DB_PASSWORD/ci-db-password/g; s/CHANGE_ME_TO_AT_LEAST_32_RANDOM_CHARACTERS/ci-jwt-secret-at-least-32-characters/g; s/CHANGE_ME_TO_RANDOM_SALT/ci-ip-hash-salt/g; s/CHANGE_ME_TO_32_BYTE_SECRET_MATERIAL/ci-source-config-key-32-bytes/g; s/CHANGE_ME_ADMIN_PASSWORD/TestPassword123!/g' .env
          docker compose config >/dev/null

  package-and-release:
    needs: validate
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        name: Validate release metadata
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n ' < VERSION)"
          [[ "$VERSION" =~ ^20[0-9]{8,12}$ ]]
          TAG="download-v${VERSION}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Build deployment packages
        run: ./scripts/build-release.sh "$PWD/dist-release"
      - name: Validate packages
        shell: bash
        run: |
          set -euo pipefail
          cd dist-release
          VERSION="${{ steps.meta.outputs.version }}"
          NATIVE_ZIP="zonoe-ipa-download-${VERSION}-baota-native.zip"
          sha256sum -c zonoe-ipa-download.tar.gz.sha256
          sha256sum -c "${NATIVE_ZIP}.sha256"
          tar -tzf zonoe-ipa-download.tar.gz > package-files.txt
          grep -Fxq './install-local.sh' package-files.txt
          grep -Fxq './install-online.sh' package-files.txt
          grep -Fxq './auto_install.json' package-files.txt
          grep -Fxq './install.sh' package-files.txt
          grep -Fxq './scripts/native-install.sh' package-files.txt
          grep -Fxq './nginx.rewrite' package-files.txt
          grep -Fxq './public/index.html' package-files.txt
          unzip -Z1 "$NATIVE_ZIP" > baota-files.txt
          grep -Fxq 'auto_install.json' baota-files.txt
          grep -Fxq 'install.sh' baota-files.txt
          grep -Fxq 'scripts/native-install.sh' baota-files.txt
          grep -Fxq 'insatll.sh' baota-files.txt
          grep -Fxq 'update.sh' baota-files.txt
          grep -Fxq 'install-online.sh' baota-files.txt
          grep -Fxq 'nginx.rewrite' baota-files.txt
          grep -Fxq 'public/index.html' baota-files.txt
          cmp <(unzip -p "$NATIVE_ZIP" install.sh) <(unzip -p "$NATIVE_ZIP" scripts/native-install.sh)
          ! grep -Eq '^docker-compose.*\.yml$' baota-files.txt
          ! grep -Eq '^apps/(api|web)/Dockerfile$' baota-files.txt
          ! grep -Eq '^\.github/' baota-files.txt
      - name: Publish or refresh GitHub Release
        if: github.ref_name == 'work/zonoe-download-v1'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
          TAG: ${{ steps.meta.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          TITLE="ZONOE IPA Download ${VERSION}"
          ASSETS=(
            dist-release/zonoe-ipa-download.tar.gz
            dist-release/zonoe-ipa-download.tar.gz.sha256
            dist-release/zonoe-ipa-download-${VERSION}-baota-native.zip
            dist-release/zonoe-ipa-download-${VERSION}-baota-native.zip.sha256
            install-online.sh
            install-local.sh
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
            gh release edit "$TAG" --target "$GITHUB_SHA" --title "$TITLE" --notes-file CHANGELOG.md
          else
            gh release create "$TAG" "${ASSETS[@]}" --target "$GITHUB_SHA" --title "$TITLE" --notes-file CHANGELOG.md
          fi
          gh release view "$TAG" --json tagName,isDraft,isPrerelease,url
      - name: Upload CI deployment packages
        uses: actions/upload-artifact@v4
        with:
          name: zonoe-ipa-download-${{ steps.meta.outputs.version }}-baota-native-build
          path: |
            dist-release/zonoe-ipa-download.tar.gz
            dist-release/zonoe-ipa-download.tar.gz.sha256
            dist-release/zonoe-ipa-download-${{ steps.meta.outputs.version }}-baota-native.zip
            dist-release/zonoe-ipa-download-${{ steps.meta.outputs.version }}-baota-native.zip.sha256
            install-online.sh
            install-local.sh
          if-no-files-found: error
          retention-days: 30

  release-e2e:
    if: github.ref_name == 'work/zonoe-download-v1'
    needs: package-and-release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify published GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.package-and-release.outputs.tag }}
          VERSION: ${{ needs.package-and-release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/zonoe-release-check
          cd /tmp/zonoe-release-check
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'zonoe-ipa-download*'
          sha256sum -c zonoe-ipa-download.tar.gz.sha256
          sha256sum -c "zonoe-ipa-download-${VERSION}-baota-native.zip.sha256"
          tar -tzf zonoe-ipa-download.tar.gz >/dev/null
          unzip -t "zonoe-ipa-download-${VERSION}-baota-native.zip" >/dev/null
